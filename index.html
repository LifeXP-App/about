<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Hide the prerendered (crawler-only) markup from real browsers until React
         mounts, so humans get the animated app instead of a flash of the static
         snapshot. No-JS clients never add the class, so crawlers still see content. -->
    <style>
      .js-loading #root {
        visibility: hidden;
      }
    </style>
    <script>
      document.documentElement.classList.add("js-loading");
    </script>

    <!-- Primary -->
    <title>GamiLife: Gamified Self-Improvement &amp; Goal Tracker</title>
    <meta
      name="description"
      content="Gamify meaningful goals with GamiLife. Complete focused sessions, earn effort-based XP, and track growth across five areas of life. V1 is rolling out."
    />
    <link rel="canonical" href="https://www.gamilife.com/" />
    <link rel="alternate" type="text/plain" href="https://www.gamilife.com/llms.txt" title="GamiLife product information for AI assistants" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="GamiLife" />
    <meta name="application-name" content="GamiLife" />

    <!-- Icons & PWA -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="GamiLife" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="GamiLife" />
    <meta property="og:title" content="GamiLife — Gamify your goals and make progress visible" />
    <meta
      property="og:description"
      content="Complete focused sessions, earn effort-based XP, and make progress visible across Physique, Energy, Logic, Creativity, and Social."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.gamilife.com/" />
    <meta property="og:image" content="https://www.gamilife.com/og.png" />
    <meta property="og:image:secure_url" content="https://www.gamilife.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GamiLife — turn real effort into XP, levels, and mastery." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GamiLife — Gamify your goals and make progress visible" />
    <meta
      name="twitter:description"
      content="Complete focused sessions, earn effort-based XP, and make progress visible across five areas of life."
    />
    <meta name="twitter:image" content="https://www.gamilife.com/og.png" />
    <meta name="twitter:image:alt" content="GamiLife — turn real effort into XP, levels, and mastery." />

    <!-- Structured data: Organization, WebSite, SoftwareApplication, FAQ -->
    <script type="application/ld+json" data-home-schema>
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.gamilife.com/#organization",
          "name": "GamiLife",
          "alternateName": "GamiLife app",
          "url": "https://www.gamilife.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.gamilife.com/logodark.png",
            "width": 500,
            "height": 500
          },
          "description": "GamiLife develops a gamified self-improvement system that turns focused effort into visible progress across five areas of life."
        },
        {
          "@type": "WebSite",
          "@id": "https://www.gamilife.com/#website",
          "url": "https://www.gamilife.com/",
          "name": "GamiLife",
          "description": "Turn your growth into a game you actually want to play.",
          "publisher": { "@id": "https://www.gamilife.com/#organization" },
          "inLanguage": "en-US"
        },
        {
          "@type": "WebPage",
          "@id": "https://www.gamilife.com/#webpage",
          "url": "https://www.gamilife.com/",
          "name": "GamiLife: Gamified Self-Improvement & Goal Tracker",
          "description": "Complete focused sessions, earn effort-based XP, and track growth across five areas of life.",
          "isPartOf": { "@id": "https://www.gamilife.com/#website" },
          "about": { "@id": "https://www.gamilife.com/#app" },
          "primaryImageOfPage": { "@id": "https://www.gamilife.com/#social-image" },
          "inLanguage": "en-US"
        },
        {
          "@type": "ImageObject",
          "@id": "https://www.gamilife.com/#social-image",
          "url": "https://www.gamilife.com/og.png",
          "contentUrl": "https://www.gamilife.com/og.png",
          "width": 1200,
          "height": 630,
          "caption": "GamiLife — Gamify your goals and make progress visible"
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://www.gamilife.com/#app",
          "name": "GamiLife",
          "applicationCategory": "LifestyleApplication",
          "applicationSubCategory": "Gamified self-improvement and goal tracking",
          "url": "https://www.gamilife.com/",
          "image": { "@id": "https://www.gamilife.com/#social-image" },
          "description": "GamiLife turns real effort into XP, levels, achievements, and mastery. Its AI engine reads the context behind each focused session and awards XP across Physique, Energy, Logic, Creativity, and Social.",
          "publisher": { "@id": "https://www.gamilife.com/#organization" },
          "featureList": [
            "Real-time XP based on actual effort, not vanity metrics",
            "Difficulty that adapts as you get better",
            "AI-powered feedback on every session",
            "Mastery Titles earned through sustained commitment",
            "Private or public social accountability"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://www.gamilife.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is GamiLife?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "GamiLife is a gamified self-improvement app that turns real effort into XP, levels, Achievements, and Mastery Titles across Physique, Energy, Logic, Creativity, and Social."
              }
            },
            {
              "@type": "Question",
              "name": "How does GamiLife award XP?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Its AI engine reads the context, duration, and intent behind a focused session, then splits XP across the areas you exercised. Rewards reflect effort rather than vanity metrics."
              }
            },
            {
              "@type": "Question",
              "name": "What are the five aspects in GamiLife?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Physique covers strength and movement; Energy covers focus and stamina; Logic covers learning and strategy; Creativity covers creation and experimentation; Social covers communication and empathy."
              }
            },
            {
              "@type": "Question",
              "name": "Is GamiLife based on science?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. GamiLife applies modern habit-building ideas through immediate feedback, visible progress, identity-based behavior, adaptive difficulty, and social accountability."
              }
            },
            {
              "@type": "Question",
              "name": "What are Mastery Titles?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Mastery Titles are long-term recognition earned through sustained commitment in a life aspect. The five titles are Warrior, Protagonist, Prodigy, Alchemist, and Diplomat."
              }
            },
            {
              "@type": "Question",
              "name": "Can I use GamiLife privately?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. You decide whether GamiLife is a private personal-growth engine or a public social experience."
              }
            },
            {
              "@type": "Question",
              "name": "Is GamiLife a habit tracker?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "GamiLife can support habits, but it is broader than a habit checklist. It tracks focused work toward meaningful goals, awards XP based on each session's context, and shows growth across five life aspects."
              }
            },
            {
              "@type": "Question",
              "name": "How is GamiLife different from other gamified productivity apps?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "GamiLife rewards the context and effort behind a focused session instead of treating every checked task as equal. It combines goal sessions, a five-aspect growth profile, Achievements, Mastery Titles, and optional social accountability."
              }
            },
            {
              "@type": "Question",
              "name": "Is GamiLife available now?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "GamiLife V1 is rolling out. The official GamiLife community is already open for people to share goals and build momentum together."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>GamiLife — Gamify your goals and make your growth impossible to ignore</h1>
        <p>
          GamiLife turns real effort into XP, levels, and mastery — visible
          progress you can track, share, and be proud of. Built on modern habit
          science.
        </p>
        <h2>The five aspects</h2>
        <ul>
          <li>Physique — strength, movement, resilience.</li>
          <li>Energy — focus, stability, stamina.</li>
          <li>Logic — learning, strategy, cognition.</li>
          <li>Creativity — creation, taste, experimentation.</li>
          <li>Social — communication, empathy, presence.</li>
        </ul>
        <h2>How it works</h2>
        <ol>
          <li>Set a goal that means something.</li>
          <li>Run a focused session — GamiLife awards XP the moment you finish.</li>
          <li>Turn sustained effort into permanent Achievements and Mastery Titles.</li>
        </ol>
        <p><a href="/community">Join the GamiLife community</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
