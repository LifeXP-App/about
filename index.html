<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Hide the prerendered (crawler-only) markup from real browsers until React
         mounts, so humans get the animated app instead of a flash of the static
         snapshot. No-JS clients never add the class, so crawlers still see content. -->
    <style>
      .js-loading #root {
        visibility: hidden;
      }
    </style>
    <script>
      document.documentElement.classList.add("js-loading");
    </script>

    <!-- Primary -->
    <title>GamiLife — Gamify your goals and make progress visible</title>
    <meta
      name="description"
      content="GamiLife is a gamified self-improvement app that turns real effort into XP, levels, achievements, and mastery across five areas of life."
    />
    <link rel="canonical" href="https://www.gamilife.com/" />
    <link rel="alternate" type="text/plain" href="https://www.gamilife.com/llms.txt" title="GamiLife product information for AI assistants" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="GamiLife" />
    <meta name="application-name" content="GamiLife" />
    <meta name="keywords" content="GamiLife, gamified self-improvement, gamified habit tracker, goal tracker, personal growth app, earn XP, level up your life, achievements, mastery" />

    <!-- Icons & PWA -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="GamiLife" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="GamiLife" />
    <meta property="og:title" content="GamiLife — Make your growth impossible to ignore" />
    <meta
      property="og:description"
      content="Turn real effort into XP, levels, and mastery. Level up across Physique, Energy, Logic, Creativity, and Social. Built on modern habit science."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.gamilife.com/" />
    <meta property="og:image" content="https://www.gamilife.com/og.png" />
    <meta property="og:image:secure_url" content="https://www.gamilife.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GamiLife — turn real effort into XP, levels, and mastery." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GamiLife — Make your growth impossible to ignore" />
    <meta
      name="twitter:description"
      content="Turn real effort into XP, levels, and mastery. Built on modern habit science."
    />
    <meta name="twitter:image" content="https://www.gamilife.com/og.png" />
    <meta name="twitter:image:alt" content="GamiLife — turn real effort into XP, levels, and mastery." />

    <!-- Structured data: Organization, WebSite, SoftwareApplication, FAQ -->

        },
        {

          "name": "GamiLife — Gamify your goals and make progress visible",
          "description": "Turn real effort into XP, levels, achievements, and mastery across five areas of life.",
          "isPartOf": { "@id": "https://www.gamilife.com/#website" },
          "about": { "@id": "https://www.gamilife.com/#app" },
          "primaryImageOfPage": { "@id": "https://www.gamilife.com/#social-image" },
          "inLanguage": "en-US"
        },
        {
          "@type": "ImageObject",
          "@id": "https://www.gamilife.com/#social-image",
          "url": "https://www.gamilife.com/og.png",
          "contentUrl": "https://www.gamilife.com/og.png",
          "width": 1200,
          "height": 630,
          "caption": "GamiLife — Make your growth impossible to ignore"
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://www.gamilife.com/#app",
          "name": "GamiLife",
          "applicationCategory": "LifestyleApplication",
          "operatingSystem": "Web, iOS, Android",
          "url": "https://www.gamilife.com/",
          "image": { "@id": "https://www.gamilife.com/#social-image" },
          "description": "GamiLife turns real effort into XP, levels, achievements, and mastery. Its AI engine reads the context behind each focused session and awards XP across Physique, Energy, Logic, Creativity, and Social.",

          "offers": {
            "@type": "Offer",
            "price": "0",

          "featureList": [
            "Real-time XP based on actual effort, not vanity metrics",
            "Difficulty that adapts as you get better",
            "AI-powered feedback on every session",
            "Mastery Titles earned through sustained commitment",
            "Private or public social accountability"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://www.gamilife.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is GamiLife?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "GamiLife is a gamified self-improvement app that turns real effort into XP, levels, Achievements, and Mastery Titles across five life aspects: Physique, Energy, Logic, Creativity, and Social."
              }
            },
            {
              "@type": "Question",
              "name": "How does GamiLife award XP?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "An AI engine reads the context, duration, and intent behind each focused session and splits XP across the aspects you actually exercised. Rewards are based on real effort, not vanity metrics."
              }
            },
            {
              "@type": "Question",
              "name": "What are the five aspects in GamiLife?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Physique (strength, movement, resilience), Energy (focus, stability, stamina), Logic (learning, strategy, cognition), Creativity (creation, taste, experimentation), and Social (communication, empathy, presence)."
              }
            },
            {
              "@type": "Question",
              "name": "Is GamiLife based on science?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. GamiLife draws on modern habit-building science, including ideas popularized in Atomic Habits, and adds gamification, social accountability, and AI-powered feedback on every session."
              }
            },
            {
              "@type": "Question",
              "name": "What are Mastery Titles?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "As XP compounds, your strongest domain earns a Mastery Title such as Warrior, Protagonist, Prodigy, Alchemist, or Diplomat. They are not granted quickly — they emerge from sustained commitment."
              }
            },
            {
              "@type": "Question",
              "name": "Can I use GamiLife privately?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. You can run GamiLife as a quiet personal engine or as an open, public social environment. You control the exposure."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>GamiLife — Make your growth impossible to ignore</h1>
        <p>
          GamiLife turns real effort into XP, levels, and mastery — visible
          progress you can track, share, and be proud of. Built on modern habit
          science.
        </p>
        <h2>The five aspects</h2>
        <ul>
          <li>Physique — strength, movement, resilience.</li>
          <li>Energy — focus, stability, stamina.</li>
          <li>Logic — learning, strategy, cognition.</li>
          <li>Creativity — creation, taste, experimentation.</li>
          <li>Social — communication, empathy, presence.</li>
        </ul>
        <h2>How it works</h2>
        <ol>
          <li>Set a goal that means something.</li>
          <li>Run a focused session — GamiLife awards XP the moment you finish.</li>
          <li>Turn sustained effort into permanent Achievements and Mastery Titles.</li>
        </ol>
        <p><a href="/community">Join the GamiLife community</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
